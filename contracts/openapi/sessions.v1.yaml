openapi: 3.1.0
info:
  title: Libre AI Sessions API
  version: 1.0.0
servers:
  - url: /
x-libre-ai-domain:
  commands: [CreateSpace, AddMember, CreateSession, SetAudiencePolicy, AttachSource, JoinSession, SubmitContribution, AcknowledgeEvents, RequestSynthesis, ApproveOutcome, RejectOutcome, CloseSession, ExportSession, DeleteSession]
  queries: [GetSession, ListVisibleSources, GetEventsSince, GetParticipantState, GetDraftOutcome, PreviewAudienceExport, GetApprovedOutcome]
paths:
  /v1/sessions:
    post:
      operationId: createSession
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [spaceId, title, audiencePolicy]
              properties:
                spaceId:
                  type: string
                title:
                  type: string
                  minLength: 1
                  maxLength: 160
                audiencePolicy:
                  enum: [facilitator-private, participant-private, session-shared]
      responses:
        '201':
          description: Session created
          headers:
            ETag:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/{sessionId}:
    get:
      operationId: getSession
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Authorized session projection
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteSession
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      responses:
        '204':
          description: Session deleted according to retention policy
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/{sessionId}/contributions:
    post:
      operationId: submitContribution
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [audience, content]
              properties:
                audience:
                  enum: [private, facilitators, session]
                content:
                  type: string
                  minLength: 1
                  maxLength: 50000
      responses:
        '202':
          description: Contribution accepted into the event stream
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/{sessionId}/events:
    get:
      operationId: getEventsSince
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Audience-filtered authoritative events
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: ../schemas/session-event.v1.schema.json
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/{sessionId}/outcomes/{outcomeId}/approval:
    post:
      operationId: approveOutcome
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: outcomeId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Human-approved outcome
        default:
          $ref: '#/components/responses/Problem'
  /v1/spaces:
    post:
      operationId: createSpace
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 160
      responses:
        '201':
          description: Organization space created
        default:
          $ref: '#/components/responses/Problem'
  /v1/spaces/{spaceId}/members:
    post:
      operationId: addMember
      security:
        - sessionCookie: []
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, role]
              properties:
                userId:
                  type: string
                role:
                  enum: [owner, facilitator, participant, observer]
      responses:
        '201':
          description: Scoped membership created
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/{sessionId}/commands:
    post:
      operationId: executeSessionCommand
      x-libre-ai-operations: [SetAudiencePolicy, AttachSource, JoinSession, AcknowledgeEvents, RequestSynthesis, RejectOutcome, CloseSession, ExportSession]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command]
              properties:
                command:
                  enum: [set-audience, attach-source, join, acknowledge-events, request-synthesis, reject-outcome, close, export]
                resourceId:
                  type: string
                audience:
                  enum: [private, facilitators, session]
                cursor:
                  type: integer
                  minimum: 0
                reasonCode:
                  type: string
                  pattern: '^sessions\.[a-z0-9_.-]+$'
      responses:
        '202':
          description: Authorized command accepted
        default:
          $ref: '#/components/responses/Problem'
  /v1/sessions/{sessionId}/views/{view}:
    get:
      operationId: getSessionView
      x-libre-ai-operations: [ListVisibleSources, GetParticipantState, GetDraftOutcome, PreviewAudienceExport, GetApprovedOutcome]
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: view
          in: path
          required: true
          schema:
            enum: [sources, participant-state, draft-outcome, export-preview, approved-outcome]
      responses:
        '200':
          description: Audience-filtered session view
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-libre_ai_session
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^idem_[a-z0-9]{16,64}$'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    Revision:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"[0-9]+"$'
  responses:
    Problem:
      description: Stable refusal envelope
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/problem-details.v1.schema.json
