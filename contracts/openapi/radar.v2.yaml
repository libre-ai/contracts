openapi: 3.1.0
info:
  title: Libre AI Radar API
  version: 2.0.0
servers:
  - url: /
x-libre-ai-domain:
  commands: [PreviewSubscription, AddSubscription, UpdateSubscription, RemoveSubscription, CreateRuleSet, ActivateRuleSet, ScheduleFetch, RecordFetchResult, ReplayRuleSet, ExportCuration, DeleteCurationData]
  queries: [ListSubscriptions, GetFetchEvidence, ListCuratedItems, ExplainDecision, CompareRuleReplays, GetExport]
paths:
  /v2/radar/subscriptions:
    get:
      operationId: listSubscriptions
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Tenant subscriptions
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/Subscription'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: addSubscription
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionInput'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/subscriptions/{subscriptionId}:
    patch:
      operationId: updateSubscription
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionInput'
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: removeSubscription
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      responses:
        '204':
          description: Subscription and retained source data deleted
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/items:
    get:
      operationId: listCuratedItems
      security:
        - sessionCookie: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        '200':
          description: Curated item export page
          content:
            application/json:
              schema:
                $ref: ../schemas/curated-item-export.v2.schema.json
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/rule-sets:
    post:
      operationId: createRuleSet
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleSetInput'
      responses:
        '201':
          description: Immutable rule set version created
          content:
            application/json:
              schema:
                $ref: ../schemas/curation-rule-set.v2.schema.json
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/subscription-previews:
    post:
      operationId: previewSubscription
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionInput'
      responses:
        '200':
          description: Bounded source preview without persistence
          content:
            application/json:
              schema:
                $ref: ../schemas/radar-normalized-feed.v1.schema.json
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/rule-sets/{ruleSetId}/activation:
    post:
      operationId: activateRuleSet
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RuleSetId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      responses:
        '200':
          description: Rule set activated for future decisions
          content:
            application/json:
              schema:
                $ref: ../schemas/curation-rule-set.v2.schema.json
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/rule-sets/{ruleSetId}/replays:
    post:
      operationId: replayRuleSet
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RuleSetId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      responses:
        '202':
          description: Immutable replay projection scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReceipt'
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/rule-sets/{ruleSetId}/replays/{replayId}:
    get:
      operationId: compareRuleReplays
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/RuleSetId'
        - $ref: '#/components/parameters/ReplayId'
      responses:
        '200':
          description: Deterministic replay comparison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayComparison'
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/fetch-schedules:
    post:
      operationId: scheduleFetch
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchScheduleInput'
      responses:
        '202':
          description: Bounded fetch scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReceipt'
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/fetch-results:
    post:
      operationId: recordFetchResult
      security:
        - internalBiscuit: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Revision'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/feed-fetch.v1.schema.json#/$defs/result
      responses:
        '202':
          description: Authorized worker result recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReceipt'
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/fetches/{fetchId}:
    get:
      operationId: getFetchEvidence
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/FetchId'
      responses:
        '200':
          description: Bounded fetch evidence without hostile body
          content:
            application/json:
              schema:
                $ref: ../schemas/feed-fetch.v1.schema.json#/$defs/result
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/items/{itemId}/explanation:
    get:
      operationId: explainDecision
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Stable rule trace and source provenance
          content:
            application/json:
              schema:
                $ref: ../schemas/radar-rule-evaluation.v1.schema.json
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/exports:
    post:
      operationId: exportCuration
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      responses:
        '202':
          description: Portable curation export scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationReceipt'
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/exports/{exportId}:
    get:
      operationId: getExport
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: Tenant export
          content:
            application/json:
              schema:
                $ref: ../schemas/curated-item-export.v2.schema.json
        default:
          $ref: '#/components/responses/Problem'
  /v2/radar/data:
    delete:
      operationId: deleteCurationData
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/Revision'
      responses:
        '204':
          description: Active tenant curation data deleted
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-libre_ai_session
    internalBiscuit:
      type: http
      scheme: bearer
      bearerFormat: Biscuit
  parameters:
    RuleSetId:
      name: ruleSetId
      in: path
      required: true
      schema:
        type: string
        maxLength: 256
        pattern: '^urn:libre-ai:[a-z][a-z0-9-]*:[A-Za-z0-9._~-]+$'
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: '^[a-z][a-z0-9_-]{2,127}$'
    ReplayId:
      name: replayId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: '^[a-z][a-z0-9_-]{2,127}$'
    FetchId:
      name: fetchId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: '^[a-z][a-z0-9_-]{2,127}$'
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        maxLength: 89
        pattern: '^urn:libre-ai:radar-item:[a-f0-9]{64}$'
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: '^[a-z][a-z0-9_-]{2,127}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: '^idem_[a-z0-9]{16,64}$'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    Revision:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 22
        pattern: '^"[0-9]+"$'
  schemas:
    SubscriptionInput:
      type: object
      additionalProperties: false
      required: [url, schedule]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://(?![^/?#]*@)'
        schedule:
          enum: [hourly, daily, weekly, manual]
    Subscription:
      type: object
      additionalProperties: false
      required: [id, revision, url, schedule]
      properties:
        id:
          type: string
          maxLength: 128
          pattern: '^[a-z][a-z0-9_-]{2,127}$'
        revision:
          type: integer
          minimum: 0
          maximum: 2147483647
        url:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://(?![^/?#]*@)'
        schedule:
          enum: [hourly, daily, weekly, manual]
    RuleSetInput:
      type: object
      additionalProperties: false
      required: [schemaVersion, rules]
      properties:
        schemaVersion:
          const: libre-ai.curation-rule-set-input.v2
        rules:
          $ref: ../schemas/curation-rule-set.v2.schema.json#/properties/rules
    FetchScheduleInput:
      type: object
      additionalProperties: false
      required: [schemaVersion, sourceId]
      properties:
        schemaVersion:
          const: libre-ai.radar-fetch-schedule-input.v2
        sourceId:
          type: string
          maxLength: 256
          pattern: '^urn:libre-ai:[a-z][a-z0-9-]*:[A-Za-z0-9._~-]+$'
    OperationReceipt:
      type: object
      additionalProperties: false
      required: [schemaVersion, operationId, status]
      properties:
        schemaVersion:
          const: libre-ai.radar-operation-receipt.v2
        operationId:
          type: string
          maxLength: 128
          pattern: '^[a-z][a-z0-9_-]{2,127}$'
        status:
          const: accepted
    ReplayComparison:
      type: object
      additionalProperties: false
      required: [schemaVersion, itemId, baseline, current]
      properties:
        schemaVersion:
          const: libre-ai.radar-replay-comparison.v2
        itemId:
          type: string
          maxLength: 89
          pattern: '^urn:libre-ai:radar-item:[a-f0-9]{64}$'
        baseline:
          $ref: ../schemas/radar-rule-evaluation.v1.schema.json
        current:
          $ref: ../schemas/radar-rule-evaluation.v1.schema.json
    RadarProblem:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              enum:
                - radar.url_scheme_forbidden
                - radar.destination_forbidden
                - radar.redirect_forbidden
                - radar.invalid_limits
                - radar.invalid_source
                - radar.body_too_large
                - radar.output_too_large
                - radar.media_type_unsupported
                - radar.encoding_unsupported
                - radar.feed_malformed
                - radar.feed_kind_unsupported
                - radar.xml_dtd_forbidden
                - radar.xml_entity_forbidden
                - radar.max_depth_exceeded
                - radar.max_items_exceeded
                - radar.json_invalid
                - radar.json_not_canonical
                - radar.item_invalid
                - radar.rule_invalid
                - radar.tenant_mismatch
                - radar.revision_stale
            message:
              const: Request refused
            requestId:
              type: string
              pattern: '^req_[a-z0-9]{16,64}$'
  responses:
    Problem:
      description: Stable content-free refusal envelope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/RadarProblem'
